[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-intel-toolkit"
version = "1.0.0"
description = "Threat intel: phishing URL detector and VirusTotal checker"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Jimit Devangkumar Parikh" }]

[project.urls]
Homepage = "https://github.com/JIMIT-PARIKH-01/threat-intel-toolkit"

[project.scripts]
threatintel = "threatintel.cli:main"

[tool.setuptools]
packages = ["threatintel"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
